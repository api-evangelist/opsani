name: Opsani
description: >-
  Opsani was an enterprise software company based in Redwood City, California that
  delivered an ML-driven cloud platform for Continuous Optimization as a Service
  (COaaS), automatically and continuously tuning cloud-native (Kubernetes)
  application configurations for the best balance of performance, availability, and
  cost. Opsani was acquired by Cisco in January 2022 and folded into the Cisco
  AppDynamics full-stack observability portfolio (subsequently part of Splunk). The
  company no longer operates an independent API surface — opsani.com now redirects to
  Splunk and docs.opsani.com no longer resolves. The one surviving public first-party
  artifact is the open-source Servo (servox) optimization agent, still published on
  PyPI and hosted at github.com/opsani.
